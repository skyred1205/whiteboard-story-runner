name: Apply Runner 3.1.1 Semantic Fix

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/apply-runner-3.1.1.yml'

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-tts

      - name: Reconstruct and patch production runner
        shell: bash
        run: |
          set -euo pipefail
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          OLD_SOURCE=$(sha256sum automation/production_runner.py | awk '{print $1}')
          test "$OLD_SOURCE" = "21713423bfbfe4bf983e16d871bf456d4fc32968d81c946c5d0091a03f0e5d16"
          patch -p0 < automation/patches/runner-3.1.1-semantic.patch
          python -m py_compile automation/production_runner.py
          NEW_SOURCE=$(sha256sum automation/production_runner.py | awk '{print $1}')
          test "$NEW_SOURCE" = "1c05f173076a8900c472b0f0f93fd3959461a6db8623ca5fb019d0e931506527"
          echo "NEW_SOURCE=$NEW_SOURCE" >> "$GITHUB_ENV"

      - name: Rebuild payload parts and checksums
        shell: bash
        run: |
          set -euo pipefail
          gzip -n -c automation/production_runner.py | base64 -w0 > /tmp/production_runner.py.gz.b64
          rm -f automation/runner_parts/part-*.b64
          split -b 4000 -d -a 2 /tmp/production_runner.py.gz.b64 /tmp/part-
          for f in /tmp/part-*; do
            base=$(basename "$f")
            mv "$f" "automation/runner_parts/${base}.b64"
          done
          NEW_PAYLOAD=$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')
          test "$NEW_PAYLOAD" = "0f46e824a6955c11b91ab9d64b95b10fc0d6e971f1ff7099ca446fa0f9de9113"
          echo "parts=$(find automation/runner_parts -name 'part-*.b64' | wc -l) payload=$NEW_PAYLOAD source=$NEW_SOURCE"

      - name: Commit runner payload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "whiteboard-runner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/runner_parts
          git commit -m "Fix semantic visual mapping in runner 3.1.1"
          git push origin HEAD:chatgpt-tts
