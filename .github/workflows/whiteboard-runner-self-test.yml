name: Whiteboard Runner Self Test

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-runner-self-test.yml'
      - 'automation/runner_parts/**'
      - 'automation/requirements-production.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteboard-runner-self-test
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Checkout pinned upstream renderer
        uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Verify upstream commit
        shell: bash
        run: |
          OBSERVED=$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)
          test "$OBSERVED" = "$WHITEBOARD_UPSTREAM_COMMIT"
          echo "Pinned upstream v1.0.0: $OBSERVED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Restore and validate production runner
        shell: bash
        run: |
          PAYLOAD_SHA=$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')
          test "$PAYLOAD_SHA" = "a1ed8445187a922e7f7ed2c93229da9fcbe63e9cb176845123ca0460f693557a"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          SOURCE_SHA=$(sha256sum automation/production_runner.py | awk '{print $1}')
          test "$SOURCE_SHA" = "4f578762c422fd165597d95077e8e47eb00b9697e9844b7669fd70e2b117cc38"
          python -m py_compile automation/production_runner.py
          echo "Production runner SHA-256: $SOURCE_SHA"

      - name: Create deterministic fixture
        shell: bash
        run: |
          mkdir -p automation/self-test
          cat > automation/self-test/job.json <<'JSON'
          {
            "schemaVersion": 2,
            "mode": "production",
            "enabled": true,
            "jobId": "whiteboard-runner-self-test",
            "script": "Đọc để hiểu nền tảng. Ghi lại điều cốt lõi. Luyện tập một việc nhỏ. Lặp lại đều mỗi ngày. Kiểm tra tiến bộ thường xuyên. Tiếp tục đến khi thành thạo.",
            "voiceAlias": "co-nhan",
            "voiceSpeed": 1.0,
            "renderScale": 0.25,
            "imageProvider": "local-doodle-v2",
            "output": {
              "width": 540,
              "height": 960,
              "fps": 24,
              "format": "mp4"
            },
            "rules": {
              "objectsPerPageMin": 3,
              "objectsPerPageMax": 4,
              "captionWordsMin": 4,
              "captionWordsMax": 6,
              "captionSafeZoneY": [760, 960],
              "eraseBetweenPages": true,
              "lineBeforeColor": true
            },
            "storyboard": {
              "locked": true,
              "revision": 1,
              "source": "fixture",
              "pages": [
                {
                  "sceneId": "scene-01",
                  "storyBasis": "Hiểu, ghi lại và luyện tập nhỏ",
                  "holdMs": 500,
                  "eraseMs": 700,
                  "elements": [
                    {
                      "id": "book",
                      "label": "Quyển sách đang mở",
                      "anchorText": "Đọc để hiểu nền tảng",
                      "visualWhy": "Tiếp thu kiến thức nền",
                      "slot": "top",
                      "sequence": 1
                    },
                    {
                      "id": "checklist",
                      "label": "Sổ ghi chú",
                      "anchorText": "Ghi lại điều cốt lõi",
                      "visualWhy": "Chắt lọc điều cần nhớ",
                      "slot": "mid",
                      "sequence": 2
                    },
                    {
                      "id": "dumbbell",
                      "label": "Biểu tượng luyện tập",
                      "anchorText": "Luyện tập một việc nhỏ",
                      "visualWhy": "Biến hiểu biết thành hành động",
                      "slot": "bottom",
                      "sequence": 3
                    }
                  ]
                },
                {
                  "sceneId": "scene-02",
                  "storyBasis": "Lặp lại, đo tiến bộ và thành thạo",
                  "holdMs": 600,
                  "eraseMs": 0,
                  "elements": [
                    {
                      "id": "calendar",
                      "label": "Lịch luyện tập",
                      "anchorText": "Lặp lại đều mỗi ngày",
                      "visualWhy": "Tạo nhịp rèn luyện ổn định",
                      "slot": "top",
                      "sequence": 1
                    },
                    {
                      "id": "graph",
                      "label": "Biểu đồ tiến bộ",
                      "anchorText": "Kiểm tra tiến bộ thường xuyên",
                      "visualWhy": "Nhìn thấy điểm cần điều chỉnh",
                      "slot": "mid",
                      "sequence": 2
                    },
                    {
                      "id": "target",
                      "label": "Mục tiêu thành thạo",
                      "anchorText": "Tiếp tục đến khi thành thạo",
                      "visualWhy": "Giữ hướng đi đến kết quả cuối",
                      "slot": "bottom",
                      "sequence": 3
                    }
                  ]
                }
              ]
            }
          }
          JSON

          cat > automation/self-test/subtitles.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:02,000
          Đọc để hiểu nền tảng.

          2
          00:00:02,000 --> 00:00:04,000
          Ghi lại điều cốt lõi.

          3
          00:00:04,000 --> 00:00:06,000
          Luyện tập một việc nhỏ.

          4
          00:00:06,000 --> 00:00:08,000
          Lặp lại đều mỗi ngày.

          5
          00:00:08,000 --> 00:00:10,000
          Kiểm tra tiến bộ thường xuyên.

          6
          00:00:10,000 --> 00:00:12,000
          Tiếp tục đến khi thành thạo.
          SRT

          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=12" \
            -filter:a "volume=0.02" -ac 2 -c:a pcm_s16le \
            automation/self-test/voice.wav

      - name: Run end-to-end fixture production
        run: |
          python automation/production_runner.py \
            --job automation/self-test/job.json \
            --out automation/output/self-test \
            --upstream _vendor/srt-whiteboard-animation \
            --fixture-audio automation/self-test/voice.wav \
            --fixture-srt automation/self-test/subtitles.srt

      - name: Verify deliverables
        shell: bash
        run: |
          test -s automation/output/self-test/final/final.mp4
          test -s automation/output/self-test/project.zip
          test -s automation/output/self-test/status.json
          test -s automation/output/self-test/qc-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('automation/output/self-test')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          qc = json.loads((root / 'qc-report.json').read_text(encoding='utf-8'))
          if status.get('state') != 'completed':
              raise SystemExit(f"Unexpected status: {status}")
          if qc.get('pass') is not True:
              raise SystemExit(f"QC failed: {qc}")
          print('Self-test completed and QC passed.')
          PY

      - name: Write self-test summary
        if: always()
        shell: bash
        run: |
          if [ -f automation/output/self-test/status.json ]; then
            echo '## Whiteboard runner self-test' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/self-test/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f automation/output/self-test/qc-report.json ]; then
            echo '## QC report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/self-test/qc-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload self-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-self-test
          path: automation/output/self-test
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
