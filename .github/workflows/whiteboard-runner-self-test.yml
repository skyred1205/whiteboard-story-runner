name: Whiteboard Runner Self Test

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-runner-self-test.yml'
      - '.github/workflows/whiteboard-production.yml'
      - 'automation/runner_parts/**'
      - 'automation/v33/**'
      - 'automation/requirements-production.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteboard-runner-self-test
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
      V33_PAYLOAD_SHA: 74e37b5030350b37fbd78f110e58d3d1bab3a261def92e117ff91494bd156b27
      V33_SOURCE_SHA: d0d653c033b033d15056a3ef66f72bf73d927b913271404c866a2881968094b6
      CONHAN_ASSET_SHA: f615a1ef252f016f7b4e9572468c808649492dc1d5104efcd6d7384a4fe5e1d6
      ERASER_ASSET_SHA: 88f8d5ecb0ff0f5da8d9d501898119673541f7f9a5edcc3eddb601b23c246f8c
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Verify pinned upstream
        run: test "$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)" = "$WHITEBOARD_UPSTREAM_COMMIT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Restore runners and V3.3 assets
        shell: bash
        run: |
          test "$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')" = "0f46e824a6955c11b91ab9d64b95b10fc0d6e971f1ff7099ca446fa0f9de9113"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          test "$(sha256sum automation/production_runner.py | awk '{print $1}')" = "1c05f173076a8900c472b0f0f93fd3959461a6db8623ca5fb019d0e931506527"
          test "$(sha256sum automation/v33/v33_finalize.py.gz.b64 | awk '{print $1}')" = "$V33_PAYLOAD_SHA"
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > automation/v33_finalize.py
          test "$(sha256sum automation/v33_finalize.py | awk '{print $1}')" = "$V33_SOURCE_SHA"
          python -m py_compile automation/production_runner.py automation/v33_finalize.py
          mkdir -p automation/v33/runtime-assets
          base64 -d automation/v33/assets/conhan-front.png.b64 > automation/v33/runtime-assets/conhan-front.png
          base64 -d automation/v33/assets/eraser-hand.png.b64 > automation/v33/runtime-assets/eraser-hand.png
          test "$(sha256sum automation/v33/runtime-assets/conhan-front.png | awk '{print $1}')" = "$CONHAN_ASSET_SHA"
          test "$(sha256sum automation/v33/runtime-assets/eraser-hand.png | awk '{print $1}')" = "$ERASER_ASSET_SHA"
          python - <<'PY'
          from PIL import Image
          for p in ['automation/v33/runtime-assets/conhan-front.png','automation/v33/runtime-assets/eraser-hand.png']:
              im=Image.open(p); im.load(); print(p, im.size, im.mode)
          PY

      - name: Create deterministic fixture
        shell: bash
        run: |
          mkdir -p automation/self-test
          cat > automation/self-test/job.json <<'JSON'
          {
            "schemaVersion": 2,
            "mode": "production",
            "enabled": true,
            "jobId": "whiteboard-v33-self-test",
            "script": "Tiền gốc sinh ra lãi. Lãi nhập vào vốn và tiếp tục tăng. Đường cong tăng trưởng dốc dần. Bắt đầu sớm và cho thời gian làm việc. Lãi kép giống một quả cầu tuyết. Luôn nhớ rủi ro thực tế.",
            "voiceAlias": "co-nhan",
            "voiceSpeed": 1.0,
            "imageProvider": "local-doodle-v2",
            "visualProfile": "conhan-visual-v1",
            "renderScale": 0.25,
            "output": {"width": 540, "height": 960, "fps": 24, "format": "mp4"},
            "rules": {"objectsPerPageMin":3,"objectsPerPageMax":4,"captionWordsMin":4,"captionWordsMax":6,"eraseBetweenPages":true,"lineBeforeColor":true},
            "storyboard": {
              "locked": true,
              "revision": 1,
              "source": "fixture",
              "visualProfile": "conhan-visual-v1",
              "pages": [
                {
                  "sceneId":"scene-01","storyBasis":"Lãi kép tăng dần","holdMs":500,"eraseMs":700,
                  "elements":[
                    {"id":"conhan","label":"Cổ Nhân với tiền","narrativeRole":"Mở ý bằng nhân vật cố định và tiền gốc","anchorText":"Tiền gốc sinh ra lãi","visualWhy":"Voice nói về tiền gốc sinh lãi, dùng Cổ Nhân tương tác với tiền.","renderKind":"conhan-money","mustRenderAs":["fixed Cổ Nhân character with money"],"slot":"top","sequence":1},
                    {"id":"compound","label":"Lãi nhập vào vốn","narrativeRole":"Giải thích cơ chế lãi nhập gốc","anchorText":"Lãi nhập vào vốn và tiếp tục tăng","visualWhy":"Hai phần tiền phải hợp nhất rồi tiếp tục lớn lên.","renderKind":"compound-money","mustRenderAs":["interest merging into principal"],"slot":"mid","sequence":2},
                    {"id":"growth","label":"Đường cong tăng trưởng dốc dần","narrativeRole":"Cho thấy tốc độ tăng nhanh dần","anchorText":"Đường cong tăng trưởng dốc dần","visualWhy":"Voice gọi trực tiếp đường cong tăng trưởng.","renderKind":"graph","mustRenderAs":["accelerating growth curve"],"slot":"bottom","sequence":3}
                  ]
                },
                {
                  "sceneId":"scene-02","storyBasis":"Thời gian, quả cầu tuyết và rủi ro","holdMs":600,"eraseMs":0,
                  "elements":[
                    {"id":"seed","label":"Mầm cây tăng trưởng","narrativeRole":"Minh họa lợi thế bắt đầu sớm","anchorText":"Bắt đầu sớm và cho thời gian làm việc","visualWhy":"Mầm cây phát triển là ẩn dụ cho thời gian.","renderKind":"seedling","mustRenderAs":["growing seedling"],"slot":"top","sequence":1},
                    {"id":"snowball","label":"Quả cầu tuyết lớn dần","narrativeRole":"Minh họa phép ẩn dụ lãi kép","anchorText":"Lãi kép giống một quả cầu tuyết","visualWhy":"Voice nêu trực tiếp quả cầu tuyết.","renderKind":"snowball","mustRenderAs":["snowball rolling and growing"],"slot":"mid","sequence":2},
                    {"id":"warning","label":"Cảnh báo rủi ro","narrativeRole":"Chốt bằng lưu ý rủi ro","anchorText":"Luôn nhớ rủi ro thực tế","visualWhy":"Voice cảnh báo nên phải có dấu hiệu rủi ro rõ.","renderKind":"warning","mustRenderAs":["risk warning"],"slot":"bottom","sequence":3}
                  ]
                }
              ]
            }
          }
          JSON
          cat > automation/self-test/subtitles.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:02,000
          Tiền gốc sinh ra lãi.

          2
          00:00:02,000 --> 00:00:04,000
          Lãi nhập vào vốn.

          3
          00:00:04,000 --> 00:00:06,000
          Đường cong tăng trưởng dốc dần.

          4
          00:00:06,000 --> 00:00:08,000
          Bắt đầu sớm ngay hôm nay.

          5
          00:00:08,000 --> 00:00:10,000
          Lãi kép như quả cầu tuyết.

          6
          00:00:10,000 --> 00:00:12,000
          Luôn nhớ rủi ro thực tế.
          SRT
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=12" -filter:a "volume=0.02" -ac 2 -c:a pcm_s16le automation/self-test/voice.wav

      - name: Run core fixture
        run: |
          python automation/production_runner.py \
            --job automation/self-test/job.json \
            --out automation/output/self-test \
            --upstream _vendor/srt-whiteboard-animation \
            --fixture-audio automation/self-test/voice.wav \
            --fixture-srt automation/self-test/subtitles.srt

      - name: Apply V3.3 finalizer
        run: |
          python automation/v33_finalize.py \
            --job automation/self-test/job.json \
            --out automation/output/self-test \
            --upstream _vendor/srt-whiteboard-animation \
            --assets automation/output/self-test/v33-assets \
            --character-sheet automation/v33/runtime-assets/conhan-front.png \
            --eraser-hand automation/v33/runtime-assets/eraser-hand.png

      - name: Verify V3.3 fixture
        shell: bash
        run: |
          test -s automation/output/self-test/final/final.mp4
          test -s automation/output/self-test/qc/source-contact-sheet.jpg
          test -s automation/output/self-test/qc/final-contact-sheet.jpg
          test -s automation/output/self-test/qc/transition-contact-sheet.jpg
          test -s automation/output/self-test/v33-assets/conhan-front.png
          test -s automation/output/self-test/v33-assets/eraser-hand.png
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('automation/output/self-test')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          qc=json.loads((root/'qc/v33-runner-qc.json').read_text(encoding='utf-8'))
          assert status['runnerVersion']=='3.3.0' and status['state']=='completed'
          assert qc['pass'] is True and qc['requiresChatGPTVisionGate'] is True
          assert qc.get('transitionContactSheet')
          print('V3.3 deterministic self-test PASS; independent ChatGPT vision gate required for production final.')
          PY

      - name: Upload self-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-self-test
          path: automation/output/self-test
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
