name: Whiteboard Runner Self Test

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-runner-self-test.yml'
      - 'automation/runner_parts/**'
      - 'automation/requirements-production.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteboard-runner-self-test
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Checkout pinned upstream renderer
        uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Verify upstream commit
        shell: bash
        run: |
          OBSERVED=$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)
          test "$OBSERVED" = "$WHITEBOARD_UPSTREAM_COMMIT"
          echo "Pinned upstream v1.0.0: $OBSERVED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Restore and validate production runner 3.1.1
        shell: bash
        run: |
          PAYLOAD_SHA=$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')
          test "$PAYLOAD_SHA" = "0f46e824a6955c11b91ab9d64b95b10fc0d6e971f1ff7099ca446fa0f9de9113"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          SOURCE_SHA=$(sha256sum automation/production_runner.py | awk '{print $1}')
          test "$SOURCE_SHA" = "1c05f173076a8900c472b0f0f93fd3959461a6db8623ca5fb019d0e931506527"
          python -m py_compile automation/production_runner.py
          echo "Production runner 3.1.1 SHA-256: $SOURCE_SHA"

      - name: Verify Vietnamese semantic regression fix
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('runner', 'automation/production_runner.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)

          cases = [
              ({'id':'accelerating-growth','label':'Đường cong tăng trưởng dốc dần','anchorText':'số tiền tăng nhanh hơn','mustRenderAs':['accelerating growth curve']}, 'graph'),
              ({'id':'interest-earns-interest','label':'Phần lãi nhập vào rồi tiếp tục tăng','anchorText':'phần lãi cũ tiếp tục sinh ra lãi mới','mustRenderAs':['interest merging into principal']}, 'money'),
              ({'id':'snowball-compounding','label':'Quả cầu tuyết lăn và lớn dần','anchorText':'Lãi kép giống một quả cầu tuyết','renderKind':'snowball'}, 'snowball'),
              ({'id':'risk-warning','label':'Đường tăng quá dốc kèm dấu cảnh báo','renderKind':'warning'}, 'warning'),
          ]
          for element, expected in cases:
              actual = runner.kind_for(element)
              print(element['id'], actual)
              if actual != expected:
                  raise SystemExit(f"semantic regression: {element['id']} expected {expected}, got {actual}")
          print('Vietnamese semantic regression checks passed.')
          PY

      - name: Create deterministic fixture
        shell: bash
        run: |
          mkdir -p automation/self-test
          cat > automation/self-test/job.json <<'JSON'
          {
            "schemaVersion": 2,
            "mode": "production",
            "enabled": true,
            "jobId": "whiteboard-runner-3.1.1-self-test",
            "script": "Tiền gốc sinh ra lãi. Lãi nhập vào tiền gốc và tiếp tục tăng. Đường cong tăng trưởng dốc dần. Bắt đầu sớm và cho thời gian làm việc. Lãi kép giống một quả cầu tuyết. Luôn nhớ rủi ro thực tế.",
            "voiceAlias": "co-nhan",
            "voiceSpeed": 1.0,
            "renderScale": 0.25,
            "imageProvider": "local-doodle-v2",
            "output": {"width": 540, "height": 960, "fps": 24, "format": "mp4"},
            "rules": {
              "objectsPerPageMin": 3,
              "objectsPerPageMax": 4,
              "captionWordsMin": 4,
              "captionWordsMax": 6,
              "captionSafeZoneY": [760, 960],
              "eraseBetweenPages": true,
              "lineBeforeColor": true
            },
            "storyboard": {
              "locked": true,
              "revision": 1,
              "source": "fixture",
              "pages": [
                {
                  "sceneId": "scene-01",
                  "storyBasis": "Compound interest semantics",
                  "holdMs": 500,
                  "eraseMs": 700,
                  "elements": [
                    {
                      "id": "principal",
                      "label": "Tiền gốc sinh lãi",
                      "anchorText": "Tiền gốc sinh ra lãi",
                      "visualWhy": "Show principal money",
                      "mustRenderAs": ["principal money pile"],
                      "renderKind": "money-small",
                      "slot": "top",
                      "sequence": 1
                    },
                    {
                      "id": "compound",
                      "label": "Lãi nhập vào tiền gốc",
                      "anchorText": "Lãi nhập vào tiền gốc và tiếp tục tăng",
                      "visualWhy": "Show compounding base",
                      "mustRenderAs": ["interest merging into principal"],
                      "renderKind": "compound-money",
                      "slot": "mid",
                      "sequence": 2
                    },
                    {
                      "id": "growth",
                      "label": "Đường cong tăng trưởng dốc dần",
                      "anchorText": "Đường cong tăng trưởng dốc dần",
                      "visualWhy": "Show accelerating growth",
                      "mustRenderAs": ["accelerating growth curve"],
                      "renderKind": "graph",
                      "slot": "bottom",
                      "sequence": 3
                    }
                  ]
                },
                {
                  "sceneId": "scene-02",
                  "storyBasis": "Time, snowball and risk",
                  "holdMs": 600,
                  "eraseMs": 0,
                  "elements": [
                    {
                      "id": "start-early",
                      "label": "Mầm cây tăng trưởng theo thời gian",
                      "anchorText": "Bắt đầu sớm và cho thời gian làm việc",
                      "visualWhy": "Show early start",
                      "renderKind": "seedling",
                      "slot": "top",
                      "sequence": 1
                    },
                    {
                      "id": "snowball",
                      "label": "Quả cầu tuyết lớn dần",
                      "anchorText": "Lãi kép giống một quả cầu tuyết",
                      "visualWhy": "Show snowball compounding metaphor",
                      "renderKind": "snowball",
                      "slot": "mid",
                      "sequence": 2
                    },
                    {
                      "id": "warning",
                      "label": "Cảnh báo rủi ro",
                      "anchorText": "Luôn nhớ rủi ro thực tế",
                      "visualWhy": "Show risk warning",
                      "renderKind": "warning",
                      "slot": "bottom",
                      "sequence": 3
                    }
                  ]
                }
              ]
            }
          }
          JSON

          cat > automation/self-test/subtitles.srt <<'SRT'
          1
          00:00:00,000 --> 00:00:02,000
          Tiền gốc sinh ra lãi.

          2
          00:00:02,000 --> 00:00:04,000
          Lãi nhập vào tiền gốc và tiếp tục tăng.

          3
          00:00:04,000 --> 00:00:06,000
          Đường cong tăng trưởng dốc dần.

          4
          00:00:06,000 --> 00:00:08,000
          Bắt đầu sớm và cho thời gian làm việc.

          5
          00:00:08,000 --> 00:00:10,000
          Lãi kép giống một quả cầu tuyết.

          6
          00:00:10,000 --> 00:00:12,000
          Luôn nhớ rủi ro thực tế.
          SRT

          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=12" \
            -filter:a "volume=0.02" -ac 2 -c:a pcm_s16le \
            automation/self-test/voice.wav

      - name: Run end-to-end fixture production
        run: |
          python automation/production_runner.py \
            --job automation/self-test/job.json \
            --out automation/output/self-test \
            --upstream _vendor/srt-whiteboard-animation \
            --fixture-audio automation/self-test/voice.wav \
            --fixture-srt automation/self-test/subtitles.srt

      - name: Verify deliverables and semantic QC
        shell: bash
        run: |
          test -s automation/output/self-test/final/final.mp4
          test -s automation/output/self-test/project.zip
          test -s automation/output/self-test/status.json
          test -s automation/output/self-test/qc-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('automation/output/self-test')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          qc = json.loads((root / 'qc-report.json').read_text(encoding='utf-8'))
          if status.get('state') != 'completed':
              raise SystemExit(f"Unexpected status: {status}")
          if status.get('runnerVersion') != '3.1.1':
              raise SystemExit(f"Unexpected runner version: {status}")
          if qc.get('pass') is not True:
              raise SystemExit(f"QC failed: {qc}")
          for scene in ('scene-01', 'scene-02'):
              scene_qc = json.loads((root / 'scenes' / scene / 'scene-qc.json').read_text(encoding='utf-8'))
              for element in scene_qc.get('elements', []):
                  if element.get('semanticPass') is not True or element.get('pass') is not True:
                      raise SystemExit(f"Semantic QC failed: {scene} {element}")
          print('Self-test completed; semantic QC passed.')
          PY

      - name: Write self-test summary
        if: always()
        shell: bash
        run: |
          if [ -f automation/output/self-test/status.json ]; then
            echo '## Whiteboard runner self-test' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/self-test/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f automation/output/self-test/qc-report.json ]; then
            echo '## QC report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/self-test/qc-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload self-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-self-test
          path: automation/output/self-test
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
