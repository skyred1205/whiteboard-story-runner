name: Whiteboard Runner Self Test

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-runner-self-test.yml'
      - '.github/workflows/whiteboard-production.yml'
      - 'automation/runner_parts/**'
      - 'automation/v33/**'
      - 'automation/requirements-production.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whiteboard-runner-self-test
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install runtime
        run: |
          test "$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)" = "$WHITEBOARD_UPSTREAM_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Create deterministic fixture audio
        run: |
          mkdir -p automation/v33/fixtures/runtime
          ffmpeg -y -loglevel error \
            -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=12" \
            -filter:a "volume=0.02" -ac 2 -c:a pcm_s16le \
            automation/v33/fixtures/runtime/voice.wav

      - name: Run V3.3 end to end
        run: |
          python automation/v33/run_v33.py \
            --job automation/v33/fixtures/job.json \
            --out automation/output/self-test \
            --upstream _vendor/srt-whiteboard-animation \
            --fixture-audio automation/v33/fixtures/runtime/voice.wav \
            --fixture-srt automation/v33/fixtures/subtitles.srt

      - name: Verify artifact contract
        run: |
          test -s automation/output/self-test/final/final.mp4
          test -s automation/output/self-test/project.zip
          test -s automation/output/self-test/qc/source-contact-sheet.jpg
          test -s automation/output/self-test/qc/final-contact-sheet.jpg
          test -s automation/output/self-test/qc/transition-contact-sheet.jpg
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root=Path('automation/output/self-test')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          qc=json.loads((root/'qc/v33-runner-qc.json').read_text(encoding='utf-8'))
          assert status['runnerVersion']=='3.3.0' and status['state']=='completed'
          assert qc['pass'] is True
          assert qc['requiresChatGPTVisionGate'] is True
          assert qc['eraserCleanupPass'] is True
          assert qc['transitionContactSheet']=='qc/transition-contact-sheet.jpg'

          required_bundle_files=(
              'final/final.mp4',
              'project.json',
              'status.json',
              'qc/v33-runner-qc.json',
              'qc/source-contact-sheet.jpg',
              'qc/final-contact-sheet.jpg',
              'qc/transition-contact-sheet.jpg',
          )
          with zipfile.ZipFile(root/'project.zip') as bundle:
              names=set(bundle.namelist())
              for rel in required_bundle_files:
                  assert rel in names, f'missing from project.zip: {rel}'
                  assert bundle.read(rel)==(root/rel).read_bytes(), f'stale bundle entry: {rel}'
          print('SELF_TEST_PASS')
          PY

      - name: Upload self-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-self-test
          path: automation/output/self-test
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
