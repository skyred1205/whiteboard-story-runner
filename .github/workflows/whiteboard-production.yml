name: Whiteboard Production

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - 'automation/jobs/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucylab-account
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install runtime
        run: |
          test "$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)" = "$WHITEBOARD_UPSTREAM_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Run V3.3 production
        env:
          LUCYLAB_API_KEY: ${{ secrets.LUCYLAB_API_KEY }}
        run: |
          python automation/v33/run_v33.py \
            --job automation/jobs/current.json \
            --out automation/output/production-current \
            --upstream _vendor/srt-whiteboard-animation

      - name: Write summary
        if: always()
        shell: bash
        run: |
          for f in \
            automation/output/production-current/status.json \
            automation/output/production-current/qc-report.json \
            automation/output/production-current/qc/v33-runner-qc.json; do
            if [ -f "$f" ]; then
              echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-current
          path: automation/output/production-current
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
