name: Whiteboard Production

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - 'automation/jobs/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucylab-account
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
      V33_PAYLOAD_SHA: e73316a720647fd156f96fbb4375987979bc525c310b31b8bd5e36e9e042e575
      V33_SOURCE_SHA: ae88701e4e1bd3162921efeb4dc826e0c513b2ddad2bc33d6cc819ea5087de2e
      CONHAN_ASSET_SHA: 0f4395bf47a2a5ac9947dc0517f94ddbc49846c2988c8c31132a14a65029794e
      ERASER_ASSET_SHA: 50bd24485c23b281967b9b4ea5a1200a0c48b25ae6dad75c82499f2c63411949
      DRAWING_ASSET_SHA: 3ec5e9592aff19a65084616dd6704215de5e81f3775575d5f2bf643616309647
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Validate V3.3 production contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          job=json.loads(Path('automation/jobs/current.json').read_text(encoding='utf-8'))
          if job.get('mode') != 'production' or job.get('enabled') is not True:
              raise SystemExit('JOB_CONTRACT_ERROR: production job must be enabled')
          storyboard=job.get('storyboard') or {}
          if not storyboard.get('locked'):
              raise SystemExit('JOB_CONTRACT_ERROR: storyboard must be locked')
          if job.get('visualProfile') != 'conhan-visual-v1' and storyboard.get('visualProfile') != 'conhan-visual-v1':
              raise SystemExit('JOB_CONTRACT_ERROR: V3.3 requires visualProfile=conhan-visual-v1')
          for page in storyboard.get('pages', []):
              elements=page.get('elements') or []
              if not 3 <= len(elements) <= 4:
                  raise SystemExit(f"JOB_CONTRACT_ERROR: {page.get('sceneId')} must have 3-4 elements")
              for element in elements:
                  if not element.get('renderKind'):
                      raise SystemExit(f"JOB_CONTRACT_ERROR: missing renderKind {page.get('sceneId')}/{element.get('id')}")
                  if not element.get('mustRenderAs'):
                      raise SystemExit(f"JOB_CONTRACT_ERROR: missing mustRenderAs {page.get('sceneId')}/{element.get('id')}")
          print('jobId=' + str(job.get('jobId')))
          PY

      - name: Checkout pinned upstream renderer
        uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Verify upstream commit
        shell: bash
        run: |
          OBSERVED=$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)
          test "$OBSERVED" = "$WHITEBOARD_UPSTREAM_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Restore core runner 3.1.1
        shell: bash
        run: |
          test "$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')" = "0f46e824a6955c11b91ab9d64b95b10fc0d6e971f1ff7099ca446fa0f9de9113"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          test "$(sha256sum automation/production_runner.py | awk '{print $1}')" = "1c05f173076a8900c472b0f0f93fd3959461a6db8623ca5fb019d0e931506527"
          python -m py_compile automation/production_runner.py

      - name: Build core compatibility job
        shell: bash
        run: |
          python - <<'PY'
          import copy,json
          from pathlib import Path
          job=json.loads(Path('automation/jobs/current.json').read_text(encoding='utf-8'))
          core=copy.deepcopy(job)
          core['imageProvider']='local-doodle-v2'
          Path('automation/jobs/core-compat.json').write_text(json.dumps(core,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Run LucyLab and timeline compatibility layer
        env:
          LUCYLAB_API_KEY: ${{ secrets.LUCYLAB_API_KEY }}
          WHITEBOARD_UPSTREAM_ROOT: ${{ github.workspace }}/_vendor/srt-whiteboard-animation
        run: |
          python automation/production_runner.py \
            --job automation/jobs/core-compat.json \
            --out automation/output/production-current

      - name: Restore V3.3 visual finalizer
        shell: bash
        run: |
          test "$(sha256sum automation/v33/v33_finalize.py.gz.b64 | awk '{print $1}')" = "$V33_PAYLOAD_SHA"
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > automation/v33_finalize.py
          test "$(sha256sum automation/v33_finalize.py | awk '{print $1}')" = "$V33_SOURCE_SHA"
          python -m py_compile automation/v33_finalize.py

      - name: Validate V3.3 visual assets
        shell: bash
        run: |
          test "$(sha256sum automation/v33/assets/conhan-front.png | awk '{print $1}')" = "$CONHAN_ASSET_SHA"
          test "$(sha256sum automation/v33/assets/eraser-hand.png | awk '{print $1}')" = "$ERASER_ASSET_SHA"
          test "$(sha256sum automation/v33/assets/drawing-hand.png | awk '{print $1}')" = "$DRAWING_ASSET_SHA"
          python - <<'PY'
          from PIL import Image
          paths=[
              'automation/v33/assets/conhan-front.png',
              'automation/v33/assets/eraser-hand.png',
              'automation/v33/assets/drawing-hand.png',
          ]
          for p in paths:
              print('Loading', p, flush=True)
              im=Image.open(p); im.load(); print('VALID', p, im.size, im.mode, flush=True)
          PY

      - name: Apply V3.3 visual engine
        env:
          WHITEBOARD_UPSTREAM_ROOT: ${{ github.workspace }}/_vendor/srt-whiteboard-animation
        run: |
          python automation/v33_finalize.py \
            --job automation/jobs/current.json \
            --out automation/output/production-current \
            --upstream "$WHITEBOARD_UPSTREAM_ROOT" \
            --assets automation/output/production-current/v33-assets \
            --character-sheet automation/v33/assets/conhan-front.png \
            --eraser-hand automation/v33/assets/eraser-hand.png

      - name: Verify V3.3 runner deliverables
        shell: bash
        run: |
          test -s automation/output/production-current/final/final.mp4
          test -s automation/output/production-current/project.zip
          test -s automation/output/production-current/status.json
          test -s automation/output/production-current/qc/v33-runner-qc.json
          test -s automation/output/production-current/qc/source-contact-sheet.jpg
          test -s automation/output/production-current/qc/final-contact-sheet.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('automation/output/production-current')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          qc=json.loads((root/'qc/v33-runner-qc.json').read_text(encoding='utf-8'))
          if status.get('state')!='completed' or status.get('runnerVersion')!='3.3.0':
              raise SystemExit(f'RUNNER_FAILED: {status}')
          if qc.get('pass') is not True:
              raise SystemExit(f'QC_FAILED: {qc}')
          if qc.get('requiresChatGPTVisionGate') is not True:
              raise SystemExit('QC_FAILED: independent ChatGPT vision gate must remain mandatory')
          print('Runner technical/style checks PASS; independent ChatGPT vision gate still required before FINAL.')
          PY

      - name: Write summary
        if: always()
        shell: bash
        run: |
          for f in automation/output/production-current/status.json automation/output/production-current/qc-report.json automation/output/production-current/qc/v33-runner-qc.json; do
            if [ -f "$f" ]; then
              echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-current
          path: automation/output/production-current
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
