name: Whiteboard Production

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - 'automation/jobs/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucylab-account
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      WHITEBOARD_UPSTREAM_COMMIT: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
      V33_PAYLOAD_SHA: 74e37b5030350b37fbd78f110e58d3d1bab3a261def92e117ff91494bd156b27
      V33_SOURCE_SHA: d0d653c033b033d15056a3ef66f72bf73d927b913271404c866a2881968094b6
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Validate production job
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          job = json.loads(Path('automation/jobs/current.json').read_text(encoding='utf-8'))
          if job.get('mode') != 'production':
              raise SystemExit('automation/jobs/current.json is not a production job')
          if job.get('enabled') is not True:
              raise SystemExit('production job is disabled')
          if job.get('visualProfile') != 'conhan-visual-v1' and (job.get('storyboard') or {}).get('visualProfile') != 'conhan-visual-v1':
              raise SystemExit('V3.3 production requires visualProfile=conhan-visual-v1')
          print('jobId=' + str(job.get('jobId')))
          PY

      - name: Checkout pinned upstream renderer
        uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Verify upstream commit
        shell: bash
        run: |
          OBSERVED=$(git -C _vendor/srt-whiteboard-animation rev-parse HEAD)
          test "$OBSERVED" = "$WHITEBOARD_UPSTREAM_COMMIT"
          echo "Pinned upstream v1.0.0: $OBSERVED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements-production.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -r automation/requirements-production.txt

      - name: Restore and validate core production runner
        shell: bash
        run: |
          PAYLOAD_SHA=$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')
          test "$PAYLOAD_SHA" = "0f46e824a6955c11b91ab9d64b95b10fc0d6e971f1ff7099ca446fa0f9de9113"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/production_runner.py
          SOURCE_SHA=$(sha256sum automation/production_runner.py | awk '{print $1}')
          test "$SOURCE_SHA" = "1c05f173076a8900c472b0f0f93fd3959461a6db8623ca5fb019d0e931506527"
          python -m py_compile automation/production_runner.py
          echo "Core runner 3.1.1 SHA-256: $SOURCE_SHA"

      - name: Build core compatibility job
        shell: bash
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          src=Path('automation/jobs/current.json')
          job=json.loads(src.read_text(encoding='utf-8'))
          core=copy.deepcopy(job)
          # Core 3.1.1 remains the TTS/timeline compatibility layer. The V3.3
          # finalizer owns production visuals, so core intentionally uses its
          # configured deterministic provider only for the intermediate project.
          core['imageProvider']='local-doodle-v2'
          Path('automation/jobs/core-compat.json').write_text(json.dumps(core, ensure_ascii=False, indent=2), encoding='utf-8')
          print('core compatibility provider=local-doodle-v2; final visualProfile=' + str(job.get('visualProfile')))
          PY

      - name: Run core production for TTS timeline and project contract
        env:
          LUCYLAB_API_KEY: ${{ secrets.LUCYLAB_API_KEY }}
          WHITEBOARD_UPSTREAM_ROOT: ${{ github.workspace }}/_vendor/srt-whiteboard-animation
        run: |
          python automation/production_runner.py \
            --job automation/jobs/core-compat.json \
            --out automation/output/production-current

      - name: Restore and validate V3.3 visual finalizer
        shell: bash
        run: |
          OBSERVED_PAYLOAD=$(sha256sum automation/v33/v33_finalize.py.gz.b64 | awk '{print $1}')
          test "$OBSERVED_PAYLOAD" = "$V33_PAYLOAD_SHA"
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > automation/v33_finalize.py
          OBSERVED_SOURCE=$(sha256sum automation/v33_finalize.py | awk '{print $1}')
          test "$OBSERVED_SOURCE" = "$V33_SOURCE_SHA"
          python -m py_compile automation/v33_finalize.py
          echo "V3.3 finalizer SHA-256: $OBSERVED_SOURCE"

      - name: Apply V3.3 visual engine and final QC package
        shell: bash
        env:
          WHITEBOARD_UPSTREAM_ROOT: ${{ github.workspace }}/_vendor/srt-whiteboard-animation
        run: |
          python automation/v33_finalize.py \
            --job automation/jobs/current.json \
            --out automation/output/production-current \
            --upstream "$WHITEBOARD_UPSTREAM_ROOT" \
            --assets automation/output/production-current/v33-assets \
            --character-sheet automation/v33/assets/conhan-front.webp \
            --eraser-hand automation/v33/assets/eraser-hand.webp

      - name: Verify V3.3 deliverables
        shell: bash
        run: |
          test -s automation/output/production-current/final/final.mp4
          test -s automation/output/production-current/qc/v33-runner-qc.json
          test -s automation/output/production-current/qc/source-contact-sheet.jpg
          test -s automation/output/production-current/qc/final-contact-sheet.jpg
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('automation/output/production-current')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          qc=json.loads((root/'qc/v33-runner-qc.json').read_text(encoding='utf-8'))
          if status.get('state') != 'completed' or status.get('runnerVersion') != '3.3.0':
              raise SystemExit(f'Bad V3.3 status: {status}')
          if qc.get('pass') is not True:
              raise SystemExit(f'V3.3 runner QC failed: {qc}')
          if qc.get('requiresChatGPTVisionGate') is not True:
              raise SystemExit('V3.3 must require external vision gate')
          print('V3.3 runner checks passed; ChatGPT vision gate remains mandatory before FINAL.')
          PY

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [ -f automation/output/production-current/status.json ]; then
            echo '## Whiteboard Production status' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/production-current/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f automation/output/production-current/qc-report.json ]; then
            echo '## Core QC report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/production-current/qc-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f automation/output/production-current/qc/v33-runner-qc.json ]; then
            echo '## V3.3 visual runner QC' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat automation/output/production-current/qc/v33-runner-qc.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-current
          path: automation/output/production-current
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
