name: Whiteboard V3.3 Diagnostics

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-v33-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-finalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode finalizer and print relevant source
        shell: bash
        run: |
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > /tmp/v33_finalize.py
          echo '--- draw_money / draw_object ---'
          sed -n '140,255p' /tmp/v33_finalize.py
          echo '--- renderKind dispatch ---'
          grep -n "kind==\|kind ==\|renderKind" /tmp/v33_finalize.py || true
