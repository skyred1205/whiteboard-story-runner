name: Whiteboard V3.3 Diagnostics

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-v33-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print observed checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "CORE_PAYLOAD_SHA=$(cat automation/runner_parts/part-*.b64 | sha256sum | awk '{print $1}')"
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > /tmp/production_runner.py
          echo "CORE_SOURCE_SHA=$(sha256sum /tmp/production_runner.py | awk '{print $1}')"
          echo "V33_PAYLOAD_SHA=$(sha256sum automation/v33/v33_finalize.py.gz.b64 | awk '{print $1}')"
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > /tmp/v33_finalize.py
          echo "V33_SOURCE_SHA=$(sha256sum /tmp/v33_finalize.py | awk '{print $1}')"
          echo "CONHAN_ASSET_SHA=$(sha256sum automation/v33/assets/conhan-front.png | awk '{print $1}')"
          echo "ERASER_ASSET_SHA=$(sha256sum automation/v33/assets/eraser-hand.png | awk '{print $1}')"
          echo "DRAWING_ASSET_SHA=$(sha256sum automation/v33/assets/drawing-hand.png | awk '{print $1}')"
          python -m py_compile /tmp/production_runner.py /tmp/v33_finalize.py

      - name: Validate PNG streams
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          for p in [
              'automation/v33/assets/conhan-front.png',
              'automation/v33/assets/eraser-hand.png',
              'automation/v33/assets/drawing-hand.png',
          ]:
              print('Loading', p, flush=True)
              im=Image.open(p); im.load()
              print('VALID', p, im.size, im.mode, flush=True)
          PY
