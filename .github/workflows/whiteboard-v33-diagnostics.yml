name: Whiteboard V3.3 Diagnostics

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-v33-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-finalizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode finalizer and print eraser source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d automation/v33/v33_finalize.py.gz.b64 | gzip -d > /tmp/v33_finalize.py
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/v33_finalize.py').read_text(encoding='utf-8').splitlines()
          hits = [i for i, line in enumerate(lines) if any(k in line.lower() for k in ('erase', 'eraser'))]
          if not hits:
              raise SystemExit('No eraser source found')
          spans = []
          for i in hits:
              spans.append((max(0, i-28), min(len(lines), i+42)))
          merged = []
          for start, end in sorted(spans):
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          for start, end in merged:
              print(f'--- lines {start+1}-{end} ---')
              for n in range(start, end):
                  print(f'{n+1:04d}: {lines[n]}')
          PY
