name: Whiteboard V3.3 Diagnostics

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/whiteboard-v33-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: geeklee/srt-whiteboard-animation
          ref: 696a7243c0e6ffb6827676e539c2ca5ebae2bf6b
          path: _vendor/srt-whiteboard-animation
          persist-credentials: false

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.0.0

      - name: Validate portable assets and drawing hand injection
        run: |
          python automation/v33/prepare_portable_assets.py \
            --source-dir automation/v33/assets_b64 \
            --out automation/v33/runtime-assets \
            --upstream _vendor/srt-whiteboard-animation
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in [
              Path('automation/v33/runtime-assets/conhan-front.png'),
              Path('automation/v33/runtime-assets/eraser-hand.png'),
              Path('automation/v33/runtime-assets/drawing-hand.png'),
              Path('_vendor/srt-whiteboard-animation/assets/drawing-hand.png'),
          ]:
              with Image.open(p) as im:
                  im.load()
                  print('VALID', p, im.size, im.mode)
          PY
