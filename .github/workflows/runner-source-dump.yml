name: Runner Source Dump

on:
  push:
    branches: [chatgpt-tts]
    paths:
      - '.github/workflows/runner-source-dump.yml'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Reconstruct current production runner
        shell: bash
        run: |
          mkdir -p automation/debug-source
          cat automation/runner_parts/part-*.b64 | base64 -d | gzip -d > automation/debug-source/production_runner.py
          sha256sum automation/debug-source/production_runner.py > automation/debug-source/source.sha256

      - name: Upload source dump
        uses: actions/upload-artifact@v4
        with:
          name: runner-source-dump
          path: automation/debug-source
          retention-days: 1
          compression-level: 6
